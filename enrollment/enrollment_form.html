<body>

    <!-- Change form action to point to PHP script -->
    <form action="submit_form.php" method="post">
        <h2>Enrollment Form</h2>
        

        <!-- Personal Information -->
        <div class="section">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required> 

            <label for="middleName">Middle Name:</label>
            <input type="text" id="middleName" name="middleName"> 

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required> 

            <label for="course">Course:</label>
            <select id="course" name="course" required> 
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
            </select> 

            <label for="yearLevel">Year Level:</label>
            <select id="yearLevel" name="yearLevel" required>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select> 

            <label for="semester">Semester:</label>
            <select id="semester" name="semester" required>
                <option value="1">First Semester</option>
                <option value="2">Second Semester</option>
            </select> 

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="sex">Sex:</label>
            <select id="sex" name="sex" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select> 
                
            <label for="citizenship">Citizenship:</label>
            <input type="text" id="citizenship" name="citizenship" required> 

            <label for="contNum">Contact Number:</label>
            <input type="text" id="contNum" name="contNum" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="Address">Address:</label>
            <label for="prvAddress">Province:</label>
            <input type="text" id="prvAddress" name="prvAddress" required>

            <label for="ctyAddress">City:</label>
            <input type="text" id="ctyAddress" name="ctyAddress" required>

            <label for="brgyAddress">Barangay:</label>
            <input type="text" id="brgyAddress" name="brgyAddress" required>

            <label for="strAddress">Street:</label>
            <input type="text" id="strAddress" name="strAddress" placeholder="Optional">

            <label for="zipCode">Zip/Postal Code:</label>
            <input type="number" id="zipCode" name="zipCode" pattern="\d{4}" minlength="4" maxlength="4" required>

            <label for="religion">Religion:</label>
            <input type="text" id="religion" name="religion" required>

            <label for="studType">Student Type:</label>
            <select id="studType" name="studType" required>
                <option value="New Student">New Student</option>
                <option value="Old Student">Old Student</option>
            </select>
        </div>

        <hr>center the enrollment form and make a separate page for the enrollment form and emergency contact


        <!-- Emergency Contact Information -->
        <div class="section">
            <h3>Emergency Contact</h3>

            <label for="pFirstName">First Name:</label>
            <input type="text" id="pFirstName" name="pFirstName" required> 

            <label for="pMiddleName">Middle Name:</label>
            <input type="text" id="pMiddleName" name="pMiddleName"> 

            <label for="pLastName">Last Name:</label>
            <input type="text" id="pLastName" name="pLastName" required> 

            <label for="pdob">Date of Birth:</label>
            <input type="date" id="pdob" name="pdob" required>

            <label for="relationship">Relationship:</label>
            <select id="relationship" name="relationship" required>
                <option value="Mother">Mother</option>
                <option value="Father">Father</option>
                <option value="Guardian">Guardian</option>
            </select>

            <label for="pContNum">Contact Number:</label>
            <input type="text" id="pContNum" name="pContNum" required>

            <label for="pEmail">Email:</label>
            <input type="email" id="pEmail" name="pEmail" required>
        </div>

        <button id="btn" type="submit">Submit</button>
    </form>
</body>
</html>
